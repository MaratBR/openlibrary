##############

[ageRating]
example = "Example"
targetAudience = "Целевая аудитория"
parentalGuidance = "Рекомендации для родителей"

[ageRating."?"]
rating = "Неизвестный рейтинг или без рейтинга"
ratingDescription = "Материал может содержать элементы, не подходящие для детей младше 18 лет."
examples = "Материал без присвоенного рейтинга"
targetAudience = "Из-за неизвестного характера произведения детям не рекомендуется знакомиться с этим содержанием"
parentalGuidance = "Рекомендуется контроль родителей"

[ageRating.G]
rating = "Для всех возрастов"
ratingDescription = "Материал подходит для всех возрастов. Не содержит того, что родители могли бы счесть неприемлемым или оскорбительным. Допускается лёгкое фантастическое насилие без реалистичных сцен. Нет ненормативной лексики, сексуального контента, наркотиков или взрослых тем."
examples = "Образовательные материалы, семейные развлечения, документальные фильмы о природе"
targetAudience = "Для любого возраста, особенно подходит маленьким детям"
parentalGuidance = "Контроль родителей не требуется"

[ageRating.PG]
rating = "Рекомендуется контроль родителей"
ratingDescription = "Некоторые материалы могут не подходить маленьким детям. Возможны мягкая лексика, краткие сцены насилия, пугающие моменты или намёки. Откровенного контента нет, но отдельные сцены могут нуждаться в объяснении родителей."
examples = "Лёгкие приключенческие истории, семейные комедии, спортивные документальные фильмы"
targetAudience = "Для широкой аудитории, но детям младше 8 лет требуется объяснение родителей"
parentalGuidance = "Родителям стоит оценить, подходит ли материал маленьким детям"

[ageRating.PG-13]
rating = "Рекомендуется контроль родителей для детей младше 13 лет"
ratingDescription = "Некоторые материалы могут не подходить детям младше 13 лет. Возможны умеренное насилие, краткая грубая лексика, намёки или упоминания наркотиков. Откровенного сексуального контента и натуралистичного насилия нет."
examples = "Подростковые драмы, боевики, социальные сети"
targetAudience = "Подростки и взрослые"
parentalGuidance = "Родителям настоятельно рекомендуется контролировать просмотр детьми младше 13 лет"

[ageRating.R]
rating = "Ограничен"
ratingDescription = "Содержит материалы для взрослых. Лицам младше 17 лет требуется сопровождение родителя или другого взрослого. Возможны грубая лексика, жестокое насилие, сексуальный контент, наркотики или взрослые темы."
examples = "Напряжённые драмы, фильмы ужасов, документальные фильмы о войне"
targetAudience = "Взрослые и зрелые подростки"
parentalGuidance = "Не рекомендуется лицам младше 17 лет без присмотра взрослых"

[ageRating.NC-17]
rating = "Только для взрослых"
ratingDescription = "Явно взрослый контент. Лица 17 лет и младше не допускаются. Возможны откровенный сексуальный контент, натуралистичное насилие или другие материалы, не подходящие несовершеннолетним. Наиболее сложные или спорные взрослые темы."
examples = "Откровенный контент для взрослых, крайне жестокие сцены, натуралистичные документальные фильмы"
targetAudience = "Только взрослые (18+)"
parentalGuidance = "Ни при каких обстоятельствах не подходит лицам младше 18 лет"

